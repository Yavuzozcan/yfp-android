name: YFP APK Oluştur

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Proje kaynaklarını oluştur
        run: |
          mkdir -p /tmp/yfp_source
          cat > /tmp/yfp_source.zip.b64 <<'YFP_EOF'

YFP_EOF
          base64 --decode /tmp/yfp_source.zip.b64 > /tmp/yfp_source.zip
          unzip -q /tmp/yfp_source.zip -d /tmp/yfp_source

      - name: Android proje iskeletini oluştur
        run: |
          flutter create --platforms=android --project-name yfp yfp_app
          rsync -a --exclude='.github' --exclude='README.md' /tmp/yfp_source/ yfp_app/

      - name: Paketleri yükle
        working-directory: yfp_app
        run: flutter pub get

      - name: Veritabanı kodunu üret
        working-directory: yfp_app
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Testleri çalıştır
        working-directory: yfp_app
        run: flutter test

      - name: APK oluştur
        working-directory: yfp_app
        run: flutter build apk --debug

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: YFP-debug-apk
          path: yfp_app/build/app/outputs/flutter-apk/app-debug.apk
